[defaults]
# screen: only changed (with --diff), failed and the recap; ok/skipped results are in the per-host log
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_ok_hosts = false
display_skipped_hosts = false
bin_ansible_callbacks = True

# per-host log of every task result (ok/changed/skipped/failed) in log_folder, see [callback_log_plays]
callbacks_enabled = community.general.log_plays

collections_path = /srv/ansible/collections:/usr/share/ansible/collections
roles_path = /srv/ansible/roles:/usr/share/ansible/roles:./roles

host_key_checking = False

# copy of the screen output
log_path = /srv/ansible/logs/ansible.log

retry_files_enabled = False

#timeout=1800

#[persistent_connection]
#connect_timeout = 1800
#command_timeout = 1800
#connect_retry_timeout = 1800

[callback_log_plays]
log_folder = /srv/ansible/logs/hosts

# paramiko plugin option (needed for RouterOS: password auth without trying keys from ~/.ssh)
[paramiko_connection]
look_for_keys = False
